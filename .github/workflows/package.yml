name: Package apps

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this tag, e.g. v0.9.1 (leave empty to only build)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
  # Every pull request runs the unit tests on macOS and Windows (and builds and self-tests both apps)
  # before it can be merged. Fork PRs get no secrets, so the macOS build falls back to an ad-hoc signature.
  pull_request:

# A newer push to the same pull request replaces its older run; every run on main and tags finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  macos:
    name: macOS app (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -q
      - name: Use the stable signing certificate (optional)
        # With the MACOS_SIGNING_P12 / MACOS_SIGNING_PASSWORD secrets (see
        # packaging/make_signing_certificate.sh) every build has the same identity, so macOS
        # keeps the Accessibility, Screen Recording and Automation switches across updates.
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGNING_P12" ]; then echo "No signing secret: ad-hoc signature (permissions reset on update)."; exit 0; fi
          keychain="$RUNNER_TEMP/a11y-signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/a11y-signing.p12"
          security import "$RUNNER_TEMP/a11y-signing.p12" -k "$keychain" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/a11y-signing.p12"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" > /dev/null
          hash=$(security find-certificate -c "A11y Local Signing" -Z "$keychain" | awk '/SHA-1/{print $NF}')
          test -n "$hash"
          echo "MACOS_SIGN_IDENTITY=$hash" >> "$GITHUB_ENV"
          echo "MACOS_SELF_SIGNED=1" >> "$GITHUB_ENV"
      - name: Build A11y.app and dmg
        env:
          MACOS_SIGN_IDENTITY: ${{ env.MACOS_SIGN_IDENTITY || secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/build_macos.sh
      - name: Smoke test the packaged app
        run: |
          test -x dist/A11y.app/Contents/Resources/native/bin/desktop-bridge || test -x dist/A11y.app/Contents/Frameworks/native/bin/desktop-bridge
          QT_QPA_PLATFORM=offscreen A11Y_DATA_DIR="$RUNNER_TEMP/a11y-data" dist/A11y.app/Contents/MacOS/A11y & pid=$!
          sleep 15
          kill -0 $pid
          kill $pid
          grep "A11y desktop build" "$RUNNER_TEMP/a11y-data/a11y.log"
      - name: Self-test the packaged app (HTTPS, voice, Qt, helpers)
        run: |
          A11Y_DATA_DIR="$RUNNER_TEMP/a11y-selftest" dist/A11y.app/Contents/MacOS/A11y --self-test "$RUNNER_TEMP/self-test.json" || status=$?
          cat "$RUNNER_TEMP/self-test.json"
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        with:
          name: A11y-macOS
          path: dist/A11y-macOS.dmg

  windows:
    name: Windows app (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: '1'  # Qt's fatal messages reach the log (they go to the debugger otherwise)
        run: |
          python -m pip install -r requirements.txt
          python scripts/ci_tests.py
      - name: Build A11y
        shell: pwsh
        run: packaging/build_windows.ps1
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:A11Y_DATA_DIR = Join-Path $env:RUNNER_TEMP 'a11y-data'
          $process = Start-Process -FilePath dist/A11y/A11y.exe -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) { throw "A11y exited with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id
          Select-String -Path (Join-Path $env:A11Y_DATA_DIR 'a11y.log') -Pattern 'A11y desktop build'
      - name: Self-test the packaged app (HTTPS, voice, Qt)
        shell: pwsh
        run: |
          $env:A11Y_DATA_DIR = Join-Path $env:RUNNER_TEMP 'a11y-selftest'
          $result = Join-Path $env:RUNNER_TEMP 'self-test.json'
          $process = Start-Process -FilePath dist/A11y/A11y.exe -ArgumentList '--self-test', $result -Wait -PassThru
          Get-Content $result
          if ($process.ExitCode -ne 0) { throw "Self-test failed with code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: A11y-Windows
          path: dist/A11y-Windows.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # A pushed v* tag, or the tag named when the workflow is started by hand
          # (the tag is then created on the commit that was just built and tested).
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
        run: gh release create "$TAG" artifacts/*/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "A11y $TAG" --generate-notes
